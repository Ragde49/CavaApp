name: Cava API IIS
on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore api/Cava.Api.csproj
      - run: dotnet publish api/Cava.Api.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: CavaApi-iis
          path: publish/**
